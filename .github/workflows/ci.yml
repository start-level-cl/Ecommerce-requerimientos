name: Ecommerce Requerimientos CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

env:
  NODE_VERSION: '20'
  REQ_URL: 'https://requerimientos-beige.vercel.app'

jobs:
  build-and-verify:
    name: Build Bundle & Verify Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Application
        run: pnpm run build

      - name: Verify Live Application
        run: |
          echo "Verificando endpoint de requerimientos en ${{ env.REQ_URL }}..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.REQ_URL }}" || echo "000")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "REQ_STATUS=ONLINE" >> $GITHUB_ENV
          else
            echo "REQ_STATUS=PENDING_OR_OFFLINE" >> $GITHUB_ENV
          fi

      - name: Publish Summary
        run: |
          echo "### 📋 Requerimientos & Simulador PMV Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parametro | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Modulo** | \`Ecommerce-requerimientos\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Rama** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL Asignada** | [${{ env.REQ_URL }}](${{ env.REQ_URL }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Estado Online** | \`${{ env.REQ_STATUS }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
